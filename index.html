<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조음 · 음운장애 국시 영상 (voice: elevenlabs.io)</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#fffaf0 0%,#fbf1df 60%,#f4e4c8 100%);color:#3a2f24;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:48px 24px 60px}
.kick{font-size:15px;font-weight:800;letter-spacing:.16em;color:#e07a3f}
h1{font-size:40px;margin:10px 0 6px;font-weight:900}
.lead{font-size:17px;color:#8a7558;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid #ead9bd;border-radius:22px;padding:20px 22px;box-shadow:0 8px 22px rgba(120,80,30,.10);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:#f08a24}
.card .no{font-size:14px;font-weight:900;color:#e8781e}
.card .tt{font-size:22px;font-weight:900;margin:6px 0 6px}
.card .ds{font-size:15px;color:#8a7558;line-height:1.5}
.card .meta{margin-top:12px;font-size:13px;font-weight:800;color:#fff;background:#f08a24;display:inline-block;padding:4px 12px;border-radius:14px}
.card.soon{opacity:.55}
.card.soon .meta{background:#c9b99f}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:12px;font-weight:700;color:#6f6252;background:#f6ecdc;border-radius:10px;padding:3px 9px;text-decoration:none}
.chips a:hover{background:#fde0c0}
.foot{margin-top:36px;font-size:13px;color:#a8988a;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
 <div class="kick">언어재활사 2급 국가시험 대비</div>
 <h1>조음 · 음운장애 영상</h1>
 <p class="lead">교재를 바탕으로 강의 자료를 보충해 주제별로 정리한 2D 애니메이션 강의. ★ 는 기출 포인트.</p>
 <div class="grid" id="grid"></div>
 <div class="foot">재생 단축키: Space 재생/정지 · J/L 10초 이동 · ←/→ 이전·다음 대사 · &lt; &gt; 속도 · F 전체화면<br>음성: elevenlabs.io · 개인 학습용</div>
</div>
<script>
const EPS=[{"n":1,"t":"조음음운장애 개관","d":"언어 연쇄 · 의사소통장애 · 조음장애 vs 음운장애 · 말소리장애 용어"},{"n":2,"t":"말소리 산출 기관과 음성 · 음운","d":"음성과 음운 · 말소리 기관 · 발동 · 발성 · 조음"},{"n":3,"t":"모음과 자음","d":"단모음 · 이중모음 · 활음 · 조음위치 · 조음방법 · 발성유형"},{"n":4,"t":"음운규칙과 변이음","d":"대치 · 첨가 · 탈락 · 축약 · 헷갈리는 짝 · 변이음"},{"n":5,"t":"음운자질","d":"주요 부류 · 조음방법 · 위치 · 발성유형 자질 · 자질표"},{"n":6,"t":"음절구조 · 운율 · 음성전사","d":"운율단위 · 음절유형 · IPA 전사"},{"n":7,"t":"말소리 발달과 음운인식","d":"옹알이 · 초기 · 후기 음운발달 · 자음 습득 연령 · 오류패턴 · 음운인식"},{"n":8,"t":"원인과 요인","d":"청각 · 구조 · 신경 · 언어인지 · 심리사회 · 유전 · Dodd 분류"},{"n":9,"t":"평가 절차와 검사도구","d":"APAC · U-TAP2 · 독립 · 관계분석 · 자극반응도 · 문맥검사"},{"n":10,"t":"정량 지표","d":"PCC · PVC · PWC · PWP · PMLU · 말명료도 계산"},{"n":11,"t":"오류 분석과 음운변동","d":"대치 · 생략 · 첨가 · 왜곡 · 음절구조 · 분절대치 변동 · 잔존오류"},{"n":12,"t":"치료 결정 · 목표 설정 · 일반화","d":"치료 여부 · 목표 선정 · 수직 · 수평 · 주기적 접근 · 일반화 · 종결"},{"n":13,"t":"치료 접근법","d":"조음지시법 · 짝자극 · 최소 · 최대대립 · 주기법 · 메타폰 · 핵심어휘"},{"n":14,"t":"구개열","d":"파열 유형 · 연인두 폐쇄와 VPI · 공명 · 초기 음운발달 · 오류 세 갈래 · 보상조음 · 구개 수술 · /ㅎ/ 치료","f":"ep14.html","len":"약 7분","pages":["14-1 구개열이란 · 파열 유형","14-2 연인두 폐쇄와 VPI","14-3 공명 문제","14-4 초기 음운발달 특징","14-5 조음 특성과 오류 세 갈래","14-6 보상조음","14-7 음성 특성과 구개 수술","14-8 치료 원칙과 /ㅎ/ 다리","14-9 확인 문제"]},{"n":15,"t":"청각장애","d":"귀의 구조 · 청력검사 · 청력도 · 보장구 · 언어발달 영향 · 청능훈련","f":"ep15.html","len":"약 9분 30초","pages":["15-1 청각과 말 · 언어","15-2 귀의 구조와 소리의 길","15-3 중이의 역할","15-4 달팽이관과 코르티기관","15-5 주관적 검사: 순음 · 어음","15-6 영유아 검사와 Ling 6음","15-7 객관적 검사","15-8 청력도 읽기","15-9 청력손실 정도","15-10 보청기와 인공와우","15-11 교실 환경과 의사소통 전략","15-12 청각손실과 언어발달","15-13 청능훈련","15-14 확인 문제"]},{"n":16,"t":"아동기 말실행증","d":"일반적 · 배타적 특성 · 핵심 진단 지표 · 치료"}];
document.getElementById('grid').innerHTML=EPS.map(e=>e.f?
 `<div class="card" id="ep${e.n}"><a href="${e.f}" style="text-decoration:none;color:inherit"><div class="no">${e.n}편</div><div class="tt">${e.t}</div><div class="ds">${e.d}</div><span class="meta">▶ 보기 · ${e.len}</span></a><div class="chips">${e.pages.map(p=>`<a href="${e.f}#${p.split(' ')[0]}">${p}</a>`).join('')}</div></div>`:
 `<div class="card soon" id="ep${e.n}"><div class="no">${e.n}편</div><div class="tt">${e.t}</div><div class="ds">${e.d}</div><span class="meta">준비 중</span></div>`).join('');
</script>
</body>
</html>
